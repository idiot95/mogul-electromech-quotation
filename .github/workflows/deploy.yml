name: Test & deploy

# Staging: every push to `staging` or a `claude/**` work branch.
# Live (production): every push to `main` — i.e. after a pull request is merged.
on:
  push:
    branches: [main, staging, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ ((github.ref == 'refs/heads/main' && github.event_name == 'push') || inputs.environment == 'production') && 'production' || 'staging' }}
    env:
      TARGET: ${{ ((github.ref == 'refs/heads/main' && github.event_name == 'push') || inputs.environment == 'production') && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set — skipping deploy. See docs/DEPLOY.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - name: Provision D1 + R2 (first run only)
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/cf-provision.mjs "$TARGET"
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      - name: Build & deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          npx vite build
          npx wrangler deploy --env "$TARGET"
